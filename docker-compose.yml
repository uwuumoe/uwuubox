services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      UWUU_DATABASE_URL: postgres://uwuubox:uwuubox@db:5432/uwuubox
      # REQUIRED: 64 hex chars (32 bytes). Generate: openssl rand -hex 32
      UWUU_SESSION_SECRET: ${UWUU_SESSION_SECRET:?set UWUU_SESSION_SECRET to `openssl rand -hex 32`}
      UWUU_BASE_URL: ${UWUU_BASE_URL:-http://127.0.0.1:3000}
      UWUU_STORAGE_BACKEND: ${UWUU_STORAGE_BACKEND:-local}
      UWUU_LOCAL_DIR: /app/data
      UWUU_OIDC_ENABLED: ${UWUU_OIDC_ENABLED:-false}
      UWUU_OIDC_DISCOVERY_URL: ${UWUU_OIDC_DISCOVERY_URL:-}
      UWUU_OIDC_CLIENT_ID: ${UWUU_OIDC_CLIENT_ID:-}
      UWUU_OIDC_CLIENT_SECRET: ${UWUU_OIDC_CLIENT_SECRET:-}
      UWUU_OIDC_REDIRECT_URL: ${UWUU_OIDC_REDIRECT_URL:-}
    volumes:
      - uwu-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: uwuubox
      POSTGRES_PASSWORD: uwuubox
      POSTGRES_DB: uwuubox
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uwuubox -d uwuubox"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - uwu-db:/var/lib/postgresql/data

  # Optional S3-compatible backend:
  #   docker compose --profile minio up
  # Create the bucket once: open http://127.0.0.1:9001 (minioadmin/minioadmin),
  # make bucket `uwuubox`, then set UWUU_STORAGE_BACKEND=s3 plus the
  # UWUU_S3_* vars below on the app service.
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - uwu-minio:/data

volumes:
  uwu-data:
  uwu-db:
  uwu-minio:
