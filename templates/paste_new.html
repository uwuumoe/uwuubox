{% extends "layout.html" %}
{% block title %}new paste · {{ instance_name }}{% endblock %}
{% block content %}
<h1>new paste</h1>
<form action="/api/pastes" method="post">
<label class="field">title (optional)
<input type="text" name="title" maxlength="140">
</label>
<label class="field">language (optional, auto-detected)
<input type="text" name="language" maxlength="32" placeholder="rs, py, js …">
</label>
<label class="field">body (max {{ max_paste_bytes }} bytes)
<textarea name="body" rows="18" required></textarea>
</label>
<label class="field">expires in
<select name="expires_in_secs">
<option value="600">10 minutes</option>
<option value="3600">1 hour</option>
<option value="86400" selected>24 hours</option>
{% if max_expiry_secs >= 604800 %}<option value="604800">7 days</option>{% endif %}
{% if max_expiry_secs >= 2592000 %}<option value="2592000">30 days</option>{% endif %}
</select>
</label>
{% if authed %}
<label class="field inline"><input type="checkbox" name="visibility" value="public"> list on my public profile</label>
{% endif %}
<button type="submit">publish</button>
</form>
{% endblock %}
