[package]
name = "uwuubox"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace", "limit", "fs"] }
tower_governor = { version = "0.8" }
tower-sessions = { version = "0.14" }
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
askama = { version = "0.14" }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "migrate", "chrono", "uuid"] }
argon2 = { version = "0.5" }
openidconnect = { version = "4" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aws-config = { version = "1" }
aws-sdk-s3 = { version = "1" }
syntect = { version = "5" }
infer = { version = "0.19" }
validator = { version = "0.20" }
url = { version = "2" }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
rand = { version = "0.9" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = { version = "0.15" }
bytes = { version = "1" }
async-trait = { version = "0.1" }
sha2 = { version = "0.10" }
hex = { version = "0.4" }
base64 = { version = "0.22" }
chacha20poly1305 = { version = "0.10" }
mime = { version = "0.3" }
http-body-util = { version = "0.1" }
thiserror = { version = "2" }
subtle = { version = "2" }
serde_urlencoded = { version = "0.7" }
aws-credential-types = { version = "1" }
zip = { version = "2" }
pulldown-cmark = { version = "0.12" }
ammonia = { version = "4" }
lettre = { version = "0.11", default-features = false, features = ["builder", "tokio1", "tokio1-rustls", "smtp-transport", "rustls-tls"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
prometheus = { version = "0.13" }
tracing-opentelemetry = { version = "0.29" }
opentelemetry = { version = "0.28" }
opentelemetry-otlp = { version = "0.28" }
opentelemetry_sdk = { version = "0.28", features = ["trace", "rt-tokio"] }
img-parts = { version = "0.3" }
